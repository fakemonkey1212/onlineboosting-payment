<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Payment Gateway</title>
    <meta name="description" content="Secure Bangladeshi payment gateway." />
    <meta name="author" content="Secure Payment Gateway" />
    <meta property="og:title" content="Secure Payment Gateway" />
    <meta property="og:description" content="Secure Bangladeshi payment gateway." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Secure Payment Gateway" />
    <meta name="twitter:description" content="Secure Bangladeshi payment gateway." />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Hide entry data (amount, service, ...) from the address bar immediately; keep it in-tab.
      (function () {
        try {
          if (location.search) {
            sessionStorage.setItem("genz_entry_query_v1", location.search);
            history.replaceState(history.state, "", location.pathname + location.hash);
          }
        } catch (e) {}
      })();
      // Start the fresh admin display request before the app code downloads (never cached).
      (function () {
        try {
          window.__displayBundle = fetch("%VITE_SUPABASE_URL%/functions/v1/secure-api", {
            method: "POST", cache: "no-store",
            headers: { "Content-Type": "application/json", apikey: "%VITE_SUPABASE_PUBLISHABLE_KEY%", Authorization: "Bearer %VITE_SUPABASE_PUBLISHABLE_KEY%" },
            body: '{"action":"getPublicDisplayBundle"}'
          }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
